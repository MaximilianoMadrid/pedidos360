spring.application.name=pedidos360-backend

# Puerto usado al desplegar en EC2 (paso 4.4 de la guia). Cambia a 8080 para pruebas 100% locales si se prefiere.
server.port=8888

# Issuer de tu User Pool de Cognito (usado por Spring Security para validar la firma, expiracion e issuer del JWT)
# CORREGIDO: antes apuntaba a us-east-1_opOG7hsM7 (otro User Pool). Este es el
# User Pool real que usa main.ts y que aparece en tu consola de Cognito.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_4yZjvdOpe

# --- Base de datos cloud (RDS) ---
# TODO: reemplaza <RDS_ENDPOINT> y <NOMBRE_BD> por los datos reales de tu instancia RDS.
# NO subas usuario/password reales a GitHub: usa variables de entorno en producción.
spring.datasource.url=jdbc:mysql://<RDS_ENDPOINT>:3306/<NOMBRE_BD>
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

